# Release: a pushed tag v<version> (matching package.json) is tested, published to npm and released on GitHub.
#
# npm: trusted publishing (OIDC), no token and no one-time password. Set up once on npmjs.com:
#   package @jugstalt/leaflet-gl-vectortiles → Settings → Trusted Publisher → GitHub Actions:
#   organization or user "jugstalt", repository "leaflet-gl-vectortiles", workflow filename "publish.yml".
name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # the GitHub release
  id-token: write   # npm trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      # trusted publishing needs npm 11.5 or newer
      - run: npm install -g npm@latest

      - name: The tag matches the version in package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi

      - run: npm ci

      - run: npm test   # builds leaflet-gl-vectortiles.min.js and its source map

      - run: npm publish --provenance --access public

      - name: GitHub release with the notes from CHANGELOG.md and the minified build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 == "## " v {f=1; next} /^## /{f=0} f' CHANGELOG.md > release-notes.md
          gh release create "${GITHUB_REF_NAME}" leaflet-gl-vectortiles.min.js leaflet-gl-vectortiles.min.js.map \
            --title "${version}" --notes-file release-notes.md
