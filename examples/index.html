<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>leaflet-gl-vectortiles example</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root { --bg: #fff; --fg: #222; --panel: rgba(255,255,255,.94); --border: #ccc; }
    @media (prefers-color-scheme: dark) { :root { --bg: #1b1b1b; --fg: #eee; --panel: rgba(30,30,30,.94); --border: #444; } }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px system-ui, sans-serif; }
    #map { position: absolute; inset: 0; background: #fff; }   /* maps are drawn on white, like the original basemaps */
    #panel { position: absolute; top: 8px; right: 8px; z-index: 1000; width: min(360px, calc(100% - 32px)); padding: 10px 12px;
             background: var(--panel); border: 1px solid var(--border); border-radius: 6px; }
    #panel label { display: block; margin-top: 6px; }
    #panel input[type=text] { width: 100%; box-sizing: border-box; }
    #panel button { margin-top: 8px; }
    #status { margin-top: 8px; white-space: pre-wrap; max-height: 30vh; overflow: auto; font-family: ui-monospace, monospace; font-size: 11px; }
    #themes { margin-top: 8px; max-height: 30vh; overflow: auto; border-top: 1px solid var(--border); }
    #themes label { margin-top: 2px; font-size: 12px; }
    #themes:empty { display: none; }
    #info { position: absolute; bottom: 8px; left: 8px; z-index: 1000; padding: 4px 8px; background: var(--panel); border-radius: 4px; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/proj4@2.12.1/dist/proj4.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/proj4leaflet@1.0.2/src/proj4leaflet.js"></script>
  <script src="../leaflet-gl-vectortiles.js"></script>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <strong>leaflet-gl-vectortiles</strong>
  <label>Service
    <select id="preset" style="width:100%"></select>
  </label>
  <label>GL style URL(s) (…/style.json, …/root.json) or gView vtc service URL – several URLs separated by spaces are drawn on top of each other
    <textarea id="url" rows="3" style="width:100%;box-sizing:border-box;font-size:11px"></textarea>
  </label>
  <label>EPSG (gView services; empty = first of the cache)
    <input id="epsg" type="text" value="">
  </label>
  <label>proj4 definition (empty = from epsg.io)
    <input id="proj4def" type="text" value="">
  </label>
  <label><input id="osm" type="checkbox"> OpenStreetMap background (WebMercator only)</label>
  <label><input id="smooth" type="checkbox" checked> smooth wheel zoom</label>
  <label><input id="lowpower" type="checkbox"> low power (economical rendering)</label>
  <label><input id="debug" type="checkbox"> show tile grid</label>
  <label><input id="declutter" type="checkbox" checked> declutter labels</label>
  <button id="load">Load</button>
  <div id="status"></div>
  <div id="themes"></div>
</div>
<div id="info"></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const status = msg => { $('status').textContent += msg + '\n'; };
  let map, loadingCount = 0;

  function showInfo() {
    if (!map) return;
    const t = map.options.crs.transformation, res = 1 / (map.options.crs.scale(map.getZoom()) * (t && t._a ? Math.abs(t._a) : 1));
    $('info').textContent = `resolution ${res.toFixed(3)} · approx. 1:${Math.round(res * 96 / 0.0254).toLocaleString()} · zoom ${map.getZoom().toFixed(2)}` +
      (loadingCount ? ' · loading…' : '');
  }

  // themes: the style layers grouped by the first part of their id ("GEBAEUDE/…", "Grundstücke - …"),
  // switched with setLayerVisibility
  function showThemes() {
    const box = $('themes');
    box.textContent = '';
    (window.vtcLayers || []).forEach(layer => {
      const groups = new Map();
      layer.getLayers().forEach(l => {
        const name = l.id.split(/\/| - /)[0].trim();
        if (!groups.has(name)) groups.set(name, []);
        groups.get(name).push(l);
      });
      const title = document.createElement('div');
      title.style.cssText = 'margin-top:6px;font-weight:600';
      title.textContent = (layer.getStyle().name || 'style') + ' – themes';
      box.appendChild(title);
      groups.forEach((layers, name) => {
        const label = document.createElement('label'), box2 = document.createElement('input');
        box2.type = 'checkbox';
        box2.checked = layers.some(l => l.visible);
        box2.addEventListener('change', () => layer.setLayerVisibility(layers.map(l => l.id), box2.checked));
        label.append(box2, ` ${name} (${layers.length})`);
        box.appendChild(label);
      });
    });
  }

  // ready-made test services; "custom" keeps what is typed into the URL field
  const BEV = 'https://kataster.bev.gv.at/at.gv.bev.kataster/styles_kataster';
  const presets = {
    basemap:  { label: 'basemap.at (WebMercator)', urls: ['https://mapsneu.wien.gv.at/basemapvectorneu/root.json'] },
    vermv:    { label: 'BEV Kataster – Vermessung (WebMercator)', urls: [`${BEV}/kataster/style_vermv.json`, `${BEV}/symbole/style_vermv.json`], osm: true, view: [47.6, 13.6, 8] },
    gis:      { label: 'BEV Kataster – GIS (WebMercator)', urls: [`${BEV}/kataster/style_gis.json`, `${BEV}/symbole/style_gis.json`], osm: true, view: [47.6, 13.6, 8] },
    basic:    { label: 'BEV Kataster – Basic (WebMercator)', urls: [`${BEV}/kataster/style_basic.json`], osm: true, view: [47.6, 13.6, 8] },
    // only reachable on the developer's machine:
    // gview:    { label: 'gView (local, EPSG:31256)', urls: ['https://localhost:44331/vtc/sqlite/basis-sqlite'] },
    custom:   { label: 'custom URL' }
  };
  for (const [k, p] of Object.entries(presets)) $('preset').add(new Option(p.label, k));
  $('preset').addEventListener('change', () => {
    const p = presets[$('preset').value];
    if (p.urls) { $('url').value = p.urls.join('\n'); $('epsg').value = ''; }
    if (p.osm !== undefined || p.urls) $('osm').checked = !!p.osm;
  });
  $('url').addEventListener('input', () => { $('preset').value = 'custom'; });

  for (const id of ['preset', 'url', 'epsg', 'proj4def']) {
    try { const v = localStorage.getItem('glvt-' + id); if (v !== null) $(id).value = v; } catch { }
  }
  try { $('osm').checked = localStorage.getItem('glvt-osm') === '1'; } catch { }
  if (!presets[$('preset').value]) $('preset').value = 'basemap';
  if (!$('url').value.trim()) $('preset').dispatchEvent(new Event('change'));

  async function load() {
    $('status').textContent = '';
    for (const id of ['preset', 'url', 'epsg', 'proj4def']) {
      try { localStorage.setItem('glvt-' + id, $(id).value); } catch { }
    }
    try { localStorage.setItem('glvt-osm', $('osm').checked ? '1' : '0'); } catch { }
    if (map) { map.remove(); map = null; }
    $('themes').textContent = '';
    loadingCount = 0;

    // several URLs: the first one decides the map's CRS, all of them are drawn on top of each other
    const urls = $('url').value.split(/\s+/).filter(Boolean).map(u => u.replace(/\/+$/, ''));
    if (!urls.length) throw new Error('no URL');
    const base = urls[0];
    const epsgArg = $('epsg').value.trim();

    const isStyleUrl = /\.json(\?|$)/i.test(base);
    const style = await (await fetch(isStyleUrl ? base : `${base}/style.json${epsgArg ? '?epsg=' + epsgArg : ''}`)).json();
    const grid = (style.metadata || {})['gview:grid'];

    let crs;
    if (!grid) {
      // a classic GL style: WebMercator z/x/y tiles
      status(`GL style (WebMercator), ${style.layers.length} style layers`);
      crs = L.CRS.EPSG3857;
    } else {
      // a gView cache: its grid decides the map's CRS (any Proj4Leaflet CRS of the same EPSG code works too)
      status(`gView cache EPSG:${grid.epsg}, ${grid.resolutions.length} levels, ${style.layers.length} style layers` +
             (grid.webmercator ? ', WebMercator' : ', custom grid'));
      (style.metadata['gview:warnings'] || []).forEach(w => status('⚠ ' + w));

      if (String(grid.epsg) === '3857') {
        crs = L.CRS.EPSG3857;
      } else {
        let def = $('proj4def').value.trim();
        if (!def) def = (await (await fetch(`https://epsg.io/${grid.epsg}.proj4`)).text()).trim();
        crs = L.glVectorTiles.createCrs(grid, def);
      }
    }

    // Proj4Leaflet knows only the zoom levels it has resolutions for: limit the map to them
    const maxZoom = crs.options && crs.options.resolutions ? crs.options.resolutions.length - 1 : 20;
    map = L.map('map', { crs, maxZoom, zoomSnap: 0, zoomDelta: 0.5, wheelPxPerZoomLevel: 120,
                     smoothWheelZoom: $('smooth').checked });
    window.vtcMap = map;   // for debugging in the console

    // OpenStreetMap raster tiles below the vector tiles: only possible on a WebMercator map
    if ($('osm').checked) {
      if (crs === L.CRS.EPSG3857) {
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);
        status('OpenStreetMap background');
      } else {
        status('OpenStreetMap background ignored: the map is not WebMercator');
      }
    }

    // sources without attribution in their metadata (BEV: from its TileJSON, automatically)
    const attributions = {
      'mapsneu.wien.gv.at': '<a href="https://basemap.at">basemap.at</a>'
    };
    window.vtcLayers = urls.map(url => {
      const layer = L.glVectorTiles(url, {
        epsg: grid ? grid.epsg : null,
        debug: $('debug').checked,
        declutter: $('declutter').checked,
        lowPower: $('lowpower').checked,
        attribution: Object.entries(attributions).find(([host]) => url.includes(host))?.[1]
      });
      layer.on('error', e => status('Error: ' + e.error.message));
      layer.on('tileerror', e => status('Tile error: ' + e.url));
      layer.on('loading', () => { loadingCount++; showInfo(); });
      layer.on('load', () => { loadingCount = Math.max(0, loadingCount - 1); showInfo(); });
      layer.on('styleload', showThemes);
      return layer.addTo(map);
    });
    window.vtcLayer = window.vtcLayers[0];
    if (urls.length > 1) status(`${urls.length} styles on top of each other`);

    // initial view: the cache extent, or the bounds / center of the classic source
    const firstSource = Object.values(style.sources || {})[0] || {};
    if (grid && grid.extent) {
      const sw = crs.unproject(L.point(grid.extent[0], grid.extent[1]));
      const ne = crs.unproject(L.point(grid.extent[2], grid.extent[3]));
      map.fitBounds(L.latLngBounds(sw, ne));
    } else if (firstSource.bounds) {
      const b = firstSource.bounds;
      map.fitBounds([[b[1], b[0]], [b[3], b[2]]]);
    } else if ((presets[$('preset').value] || {}).view) {
      const v = presets[$('preset').value].view;
      map.setView([v[0], v[1]], v[2]);
    } else if (style.center) {
      map.setView([style.center[1], style.center[0]], style.zoom || 2);
    } else {
      map.setView([0, 0], 1);
    }

    map.on('zoomend moveend', showInfo);
    showInfo();
  }

  $('load').addEventListener('click', () => load().catch(e => status('Error: ' + e.message)));
})();
</script>
</body>
</html>
