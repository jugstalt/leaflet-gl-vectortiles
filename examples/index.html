<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>leaflet-gl-vectortiles</title>
  <meta name="description" content="Leaflet plugin for vector tiles with GL styles – WebMercator and any projection, rendering in a web worker. Try it with basemap.at and the Austrian cadastre.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232563eb'/%3E%3Cpath d='M7 22l6-12 5 8 3-5 4 9z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root {
      --bg: #f4f5f7; --fg: #1f2328; --muted: #656d76; --panel: rgba(255, 255, 255, .96); --border: #d8dee4;
      --field: #fff; --accent: #2563eb; --accent-fg: #fff; --hover: #eef2f7; --error: #cf222e; --shadow: 0 8px 28px rgba(0, 0, 0, .16);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #16181c; --fg: #e6e8eb; --muted: #9198a1; --panel: rgba(28, 31, 36, .96); --border: #3a3f46;
        --field: #22262c; --accent: #4f8cff; --accent-fg: #fff; --hover: #2a2f36; --error: #ff7b72; --shadow: 0 8px 28px rgba(0, 0, 0, .5);
      }
    }
    :root[data-theme="dark"] {
      --bg: #16181c; --fg: #e6e8eb; --muted: #9198a1; --panel: rgba(28, 31, 36, .96); --border: #3a3f46;
      --field: #22262c; --accent: #4f8cff; --accent-fg: #fff; --hover: #2a2f36; --error: #ff7b72; --shadow: 0 8px 28px rgba(0, 0, 0, .5);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
    #map { position: absolute; inset: 0; background: #fff; }   /* maps are drawn on white, like the original basemaps */

    /* ---- panel */
    #panel {
      position: absolute; top: 12px; right: 12px; z-index: 1000; width: 340px; max-width: calc(100% - 24px);
      max-height: calc(100% - 24px); display: flex; flex-direction: column;
      background: var(--panel); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow);
      backdrop-filter: blur(6px);
    }
    #panel header { display: flex; align-items: flex-start; gap: 10px; padding: 14px 14px 10px; }
    #panel header .logo { flex: none; width: 30px; height: 30px; border-radius: 8px; background: var(--accent); display: grid; place-items: center; }
    #panel header h1 { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: -.01em; }
    #panel header p { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
    #panel header .links { margin-top: 4px; font-size: 12px; }
    #panel header .links a { color: var(--accent); text-decoration: none; margin-right: 10px; }
    #panel header .links a:hover { text-decoration: underline; }
    #toggle {
      margin-left: auto; flex: none; width: 30px; height: 30px; border: 0; border-radius: 8px; background: transparent;
      color: var(--muted); font-size: 18px; line-height: 1; cursor: pointer;
    }
    #toggle:hover { background: var(--hover); color: var(--fg); }
    #body { overflow: auto; padding: 0 14px 14px; }
    #panel.collapsed { width: auto; }
    #panel.collapsed #body, #panel.collapsed header p, #panel.collapsed header .links { display: none; }
    #panel.collapsed header { padding: 8px; align-items: center; }

    .field { display: block; margin-top: 10px; }
    [hidden] { display: none !important; }
    .field > span { display: block; margin-bottom: 4px; font-size: 12px; font-weight: 600; color: var(--muted); }
    select, textarea, input[type=text] {
      width: 100%; padding: 7px 9px; border: 1px solid var(--border); border-radius: 8px; background: var(--field); color: var(--fg); font: inherit;
    }
    textarea { font: 11.5px/1.4 ui-monospace, SFMono-Regular, Consolas, monospace; resize: vertical; }
    select:focus, textarea:focus, input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
    .hint { margin: 4px 0 0; color: var(--muted); font-size: 11.5px; }

    details { margin-top: 10px; border: 1px solid var(--border); border-radius: 8px; }
    details > summary { padding: 7px 10px; cursor: pointer; font-size: 12.5px; font-weight: 600; list-style: none; display: flex; align-items: center; gap: 6px; }
    details > summary::-webkit-details-marker { display: none; }
    details > summary::before { content: "›"; display: inline-block; width: 10px; color: var(--muted); transition: transform .15s; }
    details[open] > summary::before { transform: rotate(90deg); }
    details > summary .count { margin-left: auto; font-weight: 400; color: var(--muted); }
    details > .content { padding: 0 10px 10px; }
    .check { display: flex; align-items: center; gap: 8px; padding: 3px 0; font-size: 13px; cursor: pointer; }
    .check input { margin: 0; accent-color: var(--accent); }
    .check small { color: var(--muted); }
    .check .hl {
      margin-left: auto; padding: 0 6px; border: 1px solid transparent; border-radius: 6px; background: none;
      color: var(--muted); font: inherit; font-size: 12px; line-height: 18px; cursor: pointer; opacity: .35;
    }
    .check:hover .hl { opacity: 1; }
    .check .hl:hover { border-color: var(--border); }
    .check .hl.on { opacity: 1; color: var(--accent); border-color: var(--accent); }

    .actions { display: flex; gap: 8px; margin-top: 12px; }
    button.primary {
      flex: 1; padding: 8px 12px; border: 0; border-radius: 8px; background: var(--accent); color: var(--accent-fg);
      font: inherit; font-weight: 600; cursor: pointer;
    }
    button.primary:hover { filter: brightness(1.08); }
    button.small {
      padding: 2px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--field); color: var(--fg);
      font: inherit; font-size: 11.5px; cursor: pointer;
    }
    button.small:hover { background: var(--hover); }

    #status { margin-top: 10px; font: 11.5px/1.45 ui-monospace, SFMono-Regular, Consolas, monospace; color: var(--muted); white-space: pre-wrap; }
    #status:empty { display: none; }
    #status .error { color: var(--error); }

    #themes:empty { display: none; }
    .theme-group { margin-top: 6px; }
    .theme-group + .theme-group { border-top: 1px solid var(--border); padding-top: 6px; }
    .theme-head { display: flex; align-items: center; gap: 6px; margin-bottom: 2px; font-size: 12px; font-weight: 600; color: var(--muted); }
    .theme-head span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .theme-list { max-height: 28vh; overflow: auto; }

    /* ---- map info */
    #info {
      position: absolute; bottom: 12px; left: 12px; z-index: 1000; padding: 5px 10px; border-radius: 8px;
      background: var(--panel); border: 1px solid var(--border); box-shadow: var(--shadow); font-size: 12px; color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    #info:empty { display: none; }
    #info .loading { color: var(--accent); }
    .leaflet-control-attribution { font-size: 11px; }

    @media (max-width: 560px) {
      #panel { top: 8px; right: 8px; max-width: calc(100% - 16px); max-height: calc(100% - 64px); }
      #info { bottom: 24px; left: 8px; max-width: calc(100% - 16px); }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/proj4@2.12.1/dist/proj4.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/proj4leaflet@1.0.2/src/proj4leaflet.js"></script>
  <!-- ?min: the minified build (npm run build) -->
  <script>document.write('<script src="../leaflet-gl-vectortiles' + (/[?&]min(=|&|$)/.test(location.search) ? '.min' : '') + '.js"><\/script>');</script>
</head>
<body>
<div id="map"></div>

<section id="panel" aria-label="Settings">
  <header>
    <div class="logo" aria-hidden="true">
      <svg width="18" height="18" viewBox="0 0 32 32"><path d="M4 25l8-16 7 11 4-7 5 12z" fill="#fff"/></svg>
    </div>
    <div>
      <h1>leaflet-gl-vectortiles</h1>
      <p>Vector tiles with GL styles in Leaflet – any projection, rendered in a web worker.</p>
      <div class="links">
        <a href="https://github.com/jugstalt/leaflet-gl-vectortiles" target="_blank" rel="noopener">GitHub</a>
        <a href="https://www.npmjs.com/package/@jugstalt/leaflet-gl-vectortiles" target="_blank" rel="noopener">npm</a>
        <a href="https://github.com/jugstalt/leaflet-gl-vectortiles#usage" target="_blank" rel="noopener">Docs</a>
      </div>
    </div>
    <button id="toggle" type="button" title="Hide panel" aria-expanded="true">×</button>
  </header>

  <div id="body">
    <label class="field">
      <span>Service</span>
      <select id="preset"></select>
    </label>

    <label class="field">
      <span>Style URL(s)</span>
      <textarea id="url" rows="3" spellcheck="false"></textarea>
    </label>
    <p class="hint">A GL style (…/style.json, …/root.json) or a gView vtc service URL. Several URLs (one per line) are drawn on top of each other.</p>

    <label class="field">
      <span>Color scheme</span>
      <select id="scheme">
        <option value="">Original colors</option>
        <option value="pale">Pale (background for thematic data)</option>
        <option value="grayscale">Grayscale</option>
        <option value="dark">Dark</option>
        <option value="contrast">High contrast (accessibility)</option>
        <option value="colorblind">Red-green color blindness</option>
        <option value="sepia">Sepia (old map)</option>
        <option value="tint">Tint (house color)</option>
      </select>
    </label>
    <label class="field" id="tint-field" hidden>
      <span>Tint color</span>
      <input id="tint" type="color" value="#1f6feb" style="width:100%;height:32px;padding:2px;border-radius:8px">
    </label>

    <details id="options">
      <summary>Options</summary>
      <div class="content">
        <label class="check"><input id="osm" type="checkbox"> OpenStreetMap background <small>(WebMercator)</small></label>
        <label class="check"><input id="smooth" type="checkbox" checked> Smooth wheel zoom</label>
        <label class="check"><input id="declutter" type="checkbox" checked> Declutter labels</label>
        <label class="check"><input id="lowpower" type="checkbox"> Low power <small>(economical rendering)</small></label>
        <label class="check"><input id="gpu" type="checkbox"> GPU tile rendering <small>(Chrome/Edge: often slower)</small></label>
        <label class="check"><input id="debug" type="checkbox"> Show tile grid</label>
      </div>
    </details>

    <details id="export">
      <summary>Export image</summary>
      <div class="content">
        <label class="field">
          <span>DPI</span>
          <input id="export-dpi" type="text" inputmode="numeric" value="150">
        </label>
        <label class="field">
          <span>Scale 1: <small>(empty: the map's)</small></span>
          <input id="export-scale" type="text" inputmode="numeric" placeholder="e.g. 5000">
        </label>
        <div class="actions"><button id="export-png" class="primary" type="button">Export the view as PNG</button></div>
        <p class="hint" id="export-info"></p>
      </div>
    </details>

    <details id="gview-options">
      <summary>gView services</summary>
      <div class="content">
        <label class="field">
          <span>EPSG <small>(empty: the first of the cache)</small></span>
          <input id="epsg" type="text" inputmode="numeric" placeholder="e.g. 31256">
        </label>
        <label class="field">
          <span>proj4 definition <small>(empty: from epsg.io)</small></span>
          <input id="proj4def" type="text" spellcheck="false" placeholder="+proj=tmerc …">
        </label>
      </div>
    </details>

    <div class="actions">
      <button id="load" class="primary" type="button">Load</button>
    </div>

    <div id="status"></div>

    <details id="themes-box" open>
      <summary>Themes <span class="count" id="themes-count"></span></summary>
      <div class="content" id="themes"></div>
    </details>
  </div>
</section>

<div id="info"></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  let map, loadingCount = 0;

  function status(msg, isError) {
    const line = document.createElement('div');
    line.textContent = msg;
    if (isError) line.className = 'error';
    $('status').appendChild(line);
  }

  // ---- panel: collapsible (collapsed at first on small screens)
  function setCollapsed(collapsed) {
    $('panel').classList.toggle('collapsed', collapsed);
    $('toggle').textContent = collapsed ? '☰' : '×';
    $('toggle').title = collapsed ? 'Show panel' : 'Hide panel';
    $('toggle').setAttribute('aria-expanded', String(!collapsed));
  }
  $('toggle').addEventListener('click', () => setCollapsed(!$('panel').classList.contains('collapsed')));
  if (window.matchMedia('(max-width: 560px)').matches) setCollapsed(true);

  function showInfo() {
    if (!map) return;
    const t = map.options.crs.transformation, res = 1 / (map.options.crs.scale(map.getZoom()) * (t && t._a ? Math.abs(t._a) : 1));
    $('info').innerHTML = `1:${Math.round(res * 96 / 0.0254).toLocaleString()} · ${res.toFixed(res < 10 ? 3 : 1)} m/px · zoom ${map.getZoom().toFixed(2)}` +
      (loadingCount ? ' · <span class="loading">loading…</span>' : '');
  }

  // themes: the style layers grouped by the first part of their id ("GEBAEUDE/…", "Grundstücke - …"),
  // switched with setLayerVisibility
  function showThemes() {
    const box = $('themes');
    box.textContent = '';
    let total = 0;
    (window.vtcLayers || []).forEach(layer => {
      if (!layer.getStyle()) return;
      const groups = new Map();
      layer.getLayers().forEach(l => {
        // basemap.at "GEBAEUDE/…", BEV "Grundstücke - …"; otherwise (gView) the source layer
        const name = /\/| - /.test(l.id) ? l.id.split(/\/| - /)[0].trim()
          : (l.sourceLayer || l.id).replace(/__labels$/, '');
        if (!groups.has(name)) groups.set(name, []);
        groups.get(name).push(l);
      });
      total += groups.size;

      const group = document.createElement('div'), head = document.createElement('div'), list = document.createElement('div');
      group.className = 'theme-group';
      head.className = 'theme-head';
      list.className = 'theme-list';
      const title = document.createElement('span');
      title.textContent = layer.getStyle().name || 'Style';
      title.title = title.textContent;
      head.appendChild(title);

      const checks = [], highlights = [];
      groups.forEach((layers, name) => {
        const label = document.createElement('label'), input = document.createElement('input'), count = document.createElement('small');
        label.className = 'check';
        input.type = 'checkbox';
        input.checked = layers.some(l => l.visible);
        input.addEventListener('change', () => layer.setLayerVisibility(layers.map(l => l.id), input.checked));
        count.textContent = layers.length;
        // highlight: this theme as in the style, everything else of the style pale (again: all normal)
        const hl = document.createElement('button');
        hl.type = 'button';
        hl.className = 'hl';
        hl.textContent = '★';
        hl.title = 'Highlight ' + name;
        hl.addEventListener('click', e => {
          e.preventDefault();
          const on = !hl.classList.contains('on');
          highlights.forEach(b => b.classList.remove('on'));
          hl.classList.toggle('on', on);
          layer.highlight(on ? layers.map(l => l.id) : null, { dim: 'pale' });
        });
        highlights.push(hl);
        label.append(input, ' ' + name + ' ', count, hl);
        list.appendChild(label);
        checks.push(input);
      });
      for (const [text, on] of [['all', true], ['none', false]]) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'small';
        button.textContent = text;
        button.addEventListener('click', () => {
          checks.forEach(c => { c.checked = on; });
          layer.setLayerVisibility(() => true, on);
        });
        head.appendChild(button);
      }
      group.append(head, list);
      box.appendChild(group);
    });
    $('themes-count').textContent = total ? total : '';
  }

  // ready-made services; "custom" keeps what is typed into the URL field
  const BEV = 'https://kataster.bev.gv.at/at.gv.bev.kataster/styles_kataster';
  const presets = {
    basemap:  { label: 'basemap.at – Austria (WebMercator)', urls: ['https://mapsneu.wien.gv.at/basemapvectorneu/root.json'], view: [48.2082, 16.3738, 15] },
    vermv:    { label: 'BEV cadastre – survey (WebMercator)', urls: [`${BEV}/kataster/style_vermv.json`, `${BEV}/symbole/style_vermv.json`], osm: true, view: [47.8095, 13.0550, 17] },
    gis:      { label: 'BEV cadastre – GIS (WebMercator)', urls: [`${BEV}/kataster/style_gis.json`, `${BEV}/symbole/style_gis.json`], osm: true, view: [47.8095, 13.0550, 17] },
    basic:    { label: 'BEV cadastre – basic (WebMercator)', urls: [`${BEV}/kataster/style_basic.json`], osm: true, view: [47.8095, 13.0550, 17] },
    basemapde: { label: 'basemap.de – Germany (WebMercator)', urls: ['https://sgx.geodatenzentrum.de/gdz_basemapde_vektor/styles/bm_web_col.json'], view: [52.5163, 13.3777, 15] },
    liberty:  { label: 'OpenFreeMap Liberty – world (WebMercator)', urls: ['https://tiles.openfreemap.org/styles/liberty'], view: [48.2082, 16.3738, 15] },
    positron: { label: 'OpenFreeMap Positron – world (WebMercator)', urls: ['https://tiles.openfreemap.org/styles/positron'], view: [48.2082, 16.3738, 15] },
    versatiles: { label: 'VersaTiles Colorful – world (WebMercator)', urls: ['https://tiles.versatiles.org/assets/styles/colorful/style.json'], view: [48.2082, 16.3738, 16] },
    // only reachable on the developer's machine:
    // gview:    { label: 'gView (local, EPSG:31256)', urls: ['https://localhost:44331/vtc/sqlite/basis-sqlite'] },
    custom:   { label: 'Custom URL…' }
  };
  for (const [k, p] of Object.entries(presets)) $('preset').add(new Option(p.label, k));
  $('preset').addEventListener('change', () => {
    const p = presets[$('preset').value];
    if (p.urls) { $('url').value = p.urls.join('\n'); $('epsg').value = ''; }
    if (p.osm !== undefined || p.urls) $('osm').checked = !!p.osm;
    if (p.urls) run();   // a preset loads at once
    else $('url').focus();
  });
  $('url').addEventListener('input', () => { $('preset').value = 'custom'; });

  for (const id of ['preset', 'url', 'epsg', 'proj4def']) {
    try { const v = localStorage.getItem('glvt-' + id); if (v !== null) $(id).value = v; } catch { }
  }
  try { const v = localStorage.getItem('glvt-osm'); if (v !== null) $('osm').checked = v === '1'; } catch { }
  if (!presets[$('preset').value]) $('preset').value = 'basemap';
  if (!$('url').value.trim()) {
    const p = presets[$('preset').value];
    if (p.urls) { $('url').value = p.urls.join('\n'); $('osm').checked = !!p.osm; }
  }

  async function load() {
    $('status').textContent = '';
    for (const id of ['preset', 'url', 'epsg', 'proj4def']) {
      try { localStorage.setItem('glvt-' + id, $(id).value); } catch { }
    }
    try { localStorage.setItem('glvt-osm', $('osm').checked ? '1' : '0'); } catch { }
    if (map) { map.remove(); map = null; }
    $('themes').textContent = '';
    $('themes-count').textContent = '';
    $('info').textContent = '';
    loadingCount = 0;

    // several URLs: the first one decides the map's CRS, all of them are drawn on top of each other
    const urls = $('url').value.split(/\s+/).filter(Boolean).map(u => u.replace(/\/+$/, ''));
    if (!urls.length) throw new Error('no URL');
    const base = urls[0];
    const epsgArg = $('epsg').value.trim();

    // a style URL (…/style.json), a gView vtc base ({url}/style.json) or a style URL without .json (OpenFreeMap)
    const fetchJson = async url => { const r = await fetch(url); if (!r.ok) throw new Error(r.status + ' ' + url); return r.json(); };
    const style = /\.json(\?|$)/i.test(base) ? await fetchJson(base)
      : await fetchJson(`${base}/style.json${epsgArg ? '?epsg=' + epsgArg : ''}`).catch(() => fetchJson(base));
    if (!Array.isArray(style.layers)) throw new Error(style.tiles ? 'a TileJSON, not a GL style' : 'not a GL style');
    const grid = (style.metadata || {})['gview:grid'];

    let crs;
    if (!grid) {
      // a classic GL style: WebMercator z/x/y tiles
      status(`GL style (WebMercator) · ${style.layers.length} style layers`);
      crs = L.CRS.EPSG3857;
    } else {
      // a gView cache: its grid decides the map's CRS (any Proj4Leaflet CRS of the same EPSG code works too)
      status(`gView cache · EPSG:${grid.epsg} · ${grid.resolutions.length} levels · ${style.layers.length} style layers` +
             (grid.webmercator ? ' · WebMercator' : ' · custom grid'));
      (style.metadata['gview:warnings'] || []).forEach(w => status('⚠ ' + w));

      if (String(grid.epsg) === '3857') {
        crs = L.CRS.EPSG3857;
      } else {
        let def = $('proj4def').value.trim();
        if (!def) def = (await (await fetch(`https://epsg.io/${grid.epsg}.proj4`)).text()).trim();
        crs = L.glVectorTiles.createCrs(grid, def);
      }
    }

    // Proj4Leaflet knows only the zoom levels it has resolutions for: limit the map to them
    const maxZoom = crs.options && crs.options.resolutions ? crs.options.resolutions.length - 1 : 20;
    map = L.map('map', { crs, maxZoom, zoomSnap: 0, zoomDelta: 0.5, wheelPxPerZoomLevel: 120,
                     smoothWheelZoom: $('smooth').checked });
    window.vtcMap = map;   // for debugging in the console

    // OpenStreetMap raster tiles below the vector tiles: only possible on a WebMercator map
    if ($('osm').checked) {
      if (crs === L.CRS.EPSG3857) {
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);
      } else {
        status('OpenStreetMap background ignored: the map is not WebMercator');
      }
    }

    // sources without attribution in their metadata (BEV: from its TileJSON, automatically)
    const attributions = {
      'mapsneu.wien.gv.at': '<a href="https://basemap.at">basemap.at</a>'
    };
    window.vtcLayers = urls.map(url => {
      const layer = L.glVectorTiles(url, {
        epsg: grid ? grid.epsg : null,
        debug: $('debug').checked,
        declutter: $('declutter').checked,
        lowPower: $('lowpower').checked,
        gpuTileRendering: $('gpu').checked,
        colorScheme: currentScheme(),
        attribution: Object.entries(attributions).find(([host]) => url.includes(host))?.[1]
      });
      layer.on('error', e => status('Error: ' + e.error.message, true));
      layer.on('tileerror', e => status('Tile error: ' + e.url, true));
      layer.on('loading', () => { loadingCount++; showInfo(); });
      layer.on('load', () => { loadingCount = Math.max(0, loadingCount - 1); showInfo(); });
      layer.on('styleload', showThemes);
      return layer.addTo(map);
    });
    window.vtcLayer = window.vtcLayers[0];
    if (urls.length > 1) status(`${urls.length} styles on top of each other`);

    // initial view: the preset's view, the cache extent, or the bounds / center of the classic source
    const firstSource = Object.values(style.sources || {})[0] || {};
    const preset = presets[$('preset').value] || {};
    if (preset.view) {
      map.setView([preset.view[0], preset.view[1]], preset.view[2]);
    } else if (grid && grid.extent) {
      const sw = crs.unproject(L.point(grid.extent[0], grid.extent[1]));
      const ne = crs.unproject(L.point(grid.extent[2], grid.extent[3]));
      map.fitBounds(L.latLngBounds(sw, ne));
    } else if (firstSource.bounds) {
      const b = firstSource.bounds;
      map.fitBounds([[b[1], b[0]], [b[3], b[2]]]);
    } else if (style.center) {
      map.setView([style.center[1], style.center[0]], style.zoom || 2);
    } else {
      map.setView([0, 0], 1);
    }

    map.on('zoom move zoomend moveend', showInfo);
    showInfo();
  }

  // color scheme: switched at runtime (no reload); the map container's background through the same scheme
  function currentScheme() {
    const v = $('scheme').value;
    return v === 'tint' ? 'tint:' + $('tint').value : (v || null);
  }
  function applyScheme(toLayers) {
    $('tint-field').hidden = $('scheme').value !== 'tint';
    try { localStorage.setItem('glvt-scheme', $('scheme').value); localStorage.setItem('glvt-tint', $('tint').value); } catch { }
    $('map').style.background = L.glVectorTiles.schemeColor('#ffffff', currentScheme());
    if (toLayers) (window.vtcLayers || []).forEach(layer => layer.setColorScheme(currentScheme()));
  }
  try {
    const v = localStorage.getItem('glvt-scheme'); if (v !== null) $('scheme').value = v;
    const t = localStorage.getItem('glvt-tint'); if (t) $('tint').value = t;
  } catch { }
  applyScheme(false);
  $('scheme').addEventListener('change', () => applyScheme(true));
  $('tint').addEventListener('change', () => applyScheme(true));

  // export: the current view (all GL layers) as PNG, labels placed for the image size
  $('export-png').addEventListener('click', async () => {
    if (!map) return;
    const info = $('export-info');
    info.textContent = 'rendering…';
    try {
      const dpi = Number($('export-dpi').value) || 96, scale = Number($('export-scale').value) || undefined;
      const result = await L.glVectorTiles.mapToImage(map, {
        extent: map.getBounds(), dpi, scale, background: getComputedStyle($('map')).backgroundColor
      });
      info.textContent = `${result.imageSize[0]} × ${result.imageSize[1]} px · ${Math.round(result.dpi)} dpi · 1:${Math.round(result.scale).toLocaleString()}` +
        (result.complete ? '' : ' · not all tiles loaded');
      result.canvas.toBlob(blob => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'map.png';
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 10000);
      }, 'image/png');
    } catch (e) {
      info.textContent = 'Error: ' + e.message;
    }
  });

  function run() { load().catch(e => status('Error: ' + e.message, true)); }
  $('load').addEventListener('click', run);
  run();   // the map at once
})();
</script>
</body>
</html>
